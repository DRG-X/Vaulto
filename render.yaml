# Render blueprint for the Vaulto API.
#
# Render is one of several hosts that run a container from this repo; Railway and
# Fly.io work the same way off backend/Dockerfile. The frontend is NOT here — it
# goes on Vercel (see DEPLOYMENT.md).
#
# To use: Render Dashboard → New → Blueprint → point at this repository. Every
# value marked `sync: false` is left blank for you to paste in, so no secret is
# ever committed. ENVIRONMENT.md says where each one comes from.
services:
  - type: web
    name: vaulto-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter        # `free` sleeps after 15 min idle, which pauses rate alerts
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # ── Supabase Postgres ───────────────────────────────────────────────────
      - key: DATABASE_URL          # transaction pooler, port 6543
        sync: false
      - key: DIRECT_URL            # session pooler, port 5432 — used by migrations
        sync: false
      # ── Supabase Auth ───────────────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET   # only for projects still on the legacy shared secret
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      # ── CORS: the Vercel origin(s) allowed to call this API ─────────────────
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX  # optional, for Vercel preview URLs
        sync: false
      # ── Optional: cache and email ──────────────────────────────────────────
      - key: REDIS_URL             # rediss://… — NOT the Upstash REST URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
